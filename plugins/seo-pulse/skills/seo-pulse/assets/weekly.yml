name: SEO pulse

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-pulse-weekly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google authentication
        run: python -m pip install 'google-auth[requests]==2.62.0'
      - name: Read GSC and update SEO issues
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
          GSC_CREDENTIALS_PATH: ${{ runner.temp }}/seo-pulse-service-account.json
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          umask 077
          trap 'rm -f -- "$GSC_CREDENTIALS_PATH"' EXIT
          python -c 'import os, pathlib; pathlib.Path(os.environ["GSC_CREDENTIALS_PATH"]).write_text(os.environ["GSC_SERVICE_ACCOUNT_KEY"], encoding="utf-8")'
          unset GSC_SERVICE_ACCOUNT_KEY
          python .github/seo-pulse/weekly.py --config .claude/seo-pulse.json --publish
