name: Technical SEO report
on:
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: Reviewed Agent Plugins commit or release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DmitriyYukhanov/agent-plugins
          ref: ${{ inputs.plugin_ref }}
          path: pulse
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check reviewed public URL expectations
        run: python pulse/plugins/seo-pulse/skills/seo-pulse/scripts/technical.py --config site/.claude/seo-pulse.json > technical-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-seo-report
          path: technical-report.json
          if-no-files-found: warn
