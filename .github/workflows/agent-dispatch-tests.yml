name: agent-dispatch tests

# Contract tests for the agent-dispatch scripts on all three OSes. /bin/bash on purpose: on macOS
# that is the system bash 3.2 a LaunchAgent gets, and the runner keeps it for every nested shell.
# The suite borrows issue-to-pr's assert.sh, hence the second path.

on:
  push:
    branches: [main]
    paths:
      - 'plugins/agent-dispatch/**'
      - 'plugins/issue-to-pr/tests/lib/**'
      - 'plugins/issue-to-pr/scripts/lib/marker.sh'
      - '.github/workflows/agent-dispatch-tests.yml'
  pull_request:
    paths:
      - 'plugins/agent-dispatch/**'
      - 'plugins/issue-to-pr/tests/lib/**'
      - 'plugins/issue-to-pr/scripts/lib/marker.sh'
      - '.github/workflows/agent-dispatch-tests.yml'

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure shellcheck (Linux)
        if: runner.os == 'Linux'
        run: shellcheck --version || { sudo apt-get update && sudo apt-get install -y shellcheck; }

      - name: Run agent-dispatch contract tests
        run: /bin/bash plugins/agent-dispatch/tests/run-tests.sh

      - name: Run trusted SEO intake tests
        run: python -B -m unittest discover -s plugins/agent-dispatch/tests -p test_seo_intake.py
